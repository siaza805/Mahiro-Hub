name: Diagnose and build Mahiro Hub Obscura VM
on:
  push:
    branches: [obscura-vm-build]
    paths:
      - .github/workflows/obscura-vm.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve original source from Git history
        run: |
          git cat-file -e eee34df0798730f3ea3958ba561199004dd5ad6a:MahiroHub.lua
          git show eee34df0798730f3ea3958ba561199004dd5ad6a:MahiroHub.lua > /tmp/MahiroHub.source.lua
          wc -c /tmp/MahiroHub.source.lua
      - name: Install and smoke-test Obscura
        run: |
          git clone --depth 1 https://github.com/vo3pal/obscura.git /tmp/obscura
          python -m pip install -r /tmp/obscura/requirements.txt
          cd /tmp/obscura
          python main.py examples/score.luau --mode vm -o /tmp/obscura-smoke.luau
          test -s /tmp/obscura-smoke.luau
      - name: Build VM preview and capture exact failure
        id: build
        shell: bash
        run: |
          set +e
          cd /tmp/obscura
          python main.py /tmp/MahiroHub.source.lua --mode vm -o "$GITHUB_WORKSPACE/MahiroHub.obscura.lua" > "$GITHUB_WORKSPACE/obscura-build.log" 2>&1
          rc=$?
          cat "$GITHUB_WORKSPACE/obscura-build.log"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Check generated VM output
        if: steps.build.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          from pathlib import Path
          original=Path('/tmp/MahiroHub.source.lua').read_bytes()
          result=Path('MahiroHub.obscura.lua').read_bytes()
          assert len(result)>100 and result!=original, 'VM build produced an invalid or unchanged file'
          print(f'VM preview generated: {len(result)} bytes')
          PY
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obscura-diagnostics
          path: obscura-build.log
          if-no-files-found: ignore
      - name: Publish only successful VM preview
        if: steps.build.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MahiroHub.obscura.lua
          if ! git diff --cached --quiet; then
            git commit -m "Build Obscura VM protected preview"
            git push origin HEAD:obscura-vm-build
          fi
      - name: Report VM build failure
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "::error::Obscura VM build failed. Inspect the Build VM preview log and obscura-diagnostics artifact."
          exit 1
